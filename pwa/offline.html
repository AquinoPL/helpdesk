<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión - Soporte Alto Alianza</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        svg {
            width: 80px;
            height: 80px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        h1 { margin-top: 0; color: #0d6efd; font-size: 24px; }
        p { color: #6c757d; margin-bottom: 30px; line-height: 1.5; }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        <!-- SVG Icon Wi-Fi Off -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
            <path d="M10.706 3.294A1 1 0 1 0 9.294 1.88l-7.414 7.415a1 1 0 1 0 1.414 1.414l7.414-7.415zm-8.8 8.8A1 1 0 0 0 2 13h12a1 1 0 0 0 .707-1.707l-12-12A1 1 0 0 0 .293 2.707l12 12A1 1 0 0 0 13.707 14H2a1 1 0 0 0-1-1v-1a1 1 0 0 0 1-1h-.094l-1-1H2a1 1 0 0 0 1 1v1z"/>
            <path d="M10.828 10.828a5 5 0 0 1-5.656 0l-.708.708a6 6 0 0 0 7.072 0l-.708-.708zm2.122-2.122a8 8 0 0 1-9.9 0l-.708.708a9 9 0 0 0 11.314 0l-.706-.708zM14.364 5.864l-.707.707a11 11 0 0 1-11.314 0l-.707-.707a12 12 0 0 1 12.728 0z"/>
        </svg>
        <h1>Sin Conexión</h1>
        <p>Parece que has perdido la conexión a internet. El sistema Soporte Alto Alianza requiere conexión para enviar reportes o consultar información actualizada.</p>
        <button onclick="window.location.reload()">Intentar reconectar</button>
    </div>
</body>
</html>
