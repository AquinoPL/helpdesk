<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminLTE - Ejemplo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Source Sans Pro', sans-serif;
        }

        .sidebar-dark {
            background-color: #343a40;
            min-height: 100vh;
        }

        .brand-link {
            background-color: #3f474e;
            border-bottom: 1px solid #4b545c;
        }

        .nav-sidebar .nav-link {
            color: #c2c7d0;
        }

        .nav-sidebar .nav-link:hover {
            background-color: rgba(255, 255, 255, .1);
            color: #fff;
        }

        .nav-sidebar .active {
            background-color: #007bff;
            color: #fff !important;
        }

        .info-box {
            background-color: #fff;
            border-radius: 0.25rem;
            box-shadow: 0 0 1px rgba(0, 0, 0, .125), 0 1px 3px rgba(0, 0, 0, .2);
            display: flex;
            margin-bottom: 1rem;
            min-height: 80px;
            padding: .5rem;
            position: relative;
        }

        .info-box-icon {
            align-items: center;
            border-top-left-radius: 0.25rem;
            border-bottom-left-radius: 0.25rem;
            display: flex;
            font-size: 1.875rem;
            justify-content: center;
            width: 70px;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- BARRA LATERAL -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar-dark collapse p-0">
                <div class="brand-link p-3 text-white text-center fw-bold">
                    <i class="bi bi-bootstrap-fill me-2 text-info"></i> AdminLTE 3
                </div>
                <div class="p-3 text-white-50 border-bottom d-flex align-items-center">
                    <i class="bi bi-person-circle fs-3 me-2 text-white"></i> Alexander Pierce
                </div>
                <ul class="nav flex-column nav-sidebar p-2 gap-1 mt-2">
                    <li class="nav-item"><a href="#" class="nav-link active rounded"><i
                                class="bi bi-speedometer me-2"></i> Dashboard</a></li>
                    <li class="nav-item"><a href="#" class="nav-link rounded"><i class="bi bi-grid me-2"></i>
                            Widgets</a></li>
                    <li class="nav-item"><a href="#" class="nav-link rounded"><i
                                class="bi bi-layout-sidebar-me-1 me-2"></i> Opciones de Layout</a></li>
                </ul>
            </nav>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="h3 m-0">Panel de Control</h1>
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item active">Dashboard</li>
                    </ol>
                </div>

                <!-- Info Boxes -->
                <div class="row">
                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box shadow-sm">
                            <span class="info-box-icon bg-info"><i class="bi bi-gear-fill"></i></span>
                            <div class="p-2">
                                <span class="text-uppercase small text-muted">Tráfico CPU</span>
                                <h4 class="fw-bold m-0">10 <small>%</small></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-md-3">
                        <div class="info-box shadow-sm">
                            <span class="info-box-icon bg-danger"><i class="bi bi-hand-thumbs-up-fill"></i></span>
                            <div class="p-2">
                                <span class="text-uppercase small text-muted">Likes</span>
                                <h4 class="fw-bold m-0">41,410</h4>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
